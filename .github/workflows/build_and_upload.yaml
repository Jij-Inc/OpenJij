name: Build&Upload

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build_sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          uv sync --locked --group build
      - name: Build sdist
        run: |
          uv run python -m build --sdist --outdir ./dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-sdist
          path: dist/*.tar.gz
          retention-days: 30
          compression-level: 0

  build_wheels_linux_x86_64:
    name: Build wheels linux x86_64
    runs-on: ubuntu-latest
    container: ${{matrix.container}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: wheel-linux_x86_64_python310
            python: /opt/python/cp310-cp310/bin/python
            container: ghcr.io/openjij/openjij-builder-minimum-manylinux_2_28_x86_64:latest
          - artifact: wheel-linux_x86_64_python311
            python: /opt/python/cp311-cp311/bin/python
            container: ghcr.io/openjij/openjij-builder-minimum-manylinux_2_28_x86_64:latest
          - artifact: wheel-linux_x86_64_python312
            python: /opt/python/cp312-cp312/bin/python
            container: ghcr.io/openjij/openjij-builder-minimum-manylinux_2_28_x86_64:latest
          - artifact: wheel-linux_x86_64_python313
            python: /opt/python/cp313-cp313/bin/python
            container: ghcr.io/openjij/openjij-builder-minimum-manylinux_2_28_x86_64:latest
          - artifact: wheel-linux_x86_64_python314
            python: /opt/python/cp314-cp314/bin/python
            container: ghcr.io/openjij/openjij-builder-minimum-manylinux_2_28_x86_64:latest

    steps:
      - uses: actions/checkout@v5
      - name: Get Python Version
        shell: bash
        run: |
          set -eux
          ls /opt/python
          ${{matrix.python}} --version > python_version.txt
          cat python_version.txt
      - name: Install Dependencies
        shell: bash
        run: |
          set -eux
          ${{matrix.python}} -m pip install --upgrade pip
          ${{matrix.python}} -m pip install --upgrade build auditwheel
      - name: Build
        run: |
          set -x
          echo "::group::Set Intel oneAPI"
          mkdir -p /tmp/tmp
          touch /tmp/tmp/config.txt
          echo "" >> /tmp/tmp/config.txt
          source /opt/intel/oneapi/compiler/latest/env/vars.sh 
          source /opt/intel/oneapi/mkl/latest/env/vars.sh
          source /opt/intel/oneapi/setvars.sh --force  --config="/tmp/tmp/config.txt"
          du -a /opt/intel/oneapi/compiler/latest/linux/bin
          echo "::endgroup::"
          echo "::group::BUILD"
          export CIBUILDWHEEL=1
          export CC=icx
          export CXX=icpx
          export FC=ifx
          export CFLAGS='-march=x86-64-v3 -mtune=generic' 
          export CXXFLAGS='-march=x86-64-v3 -mtune=generic' 
          export FFLAGS='-march=x86-64-v3 -mtune=generic'
          ${{matrix.python}} -m build --wheel --outdir ./dist
          echo "::endgroup::"
      - name: Show Files
        id: wheel
        shell: bash
        run: |
          set -x 
          source /opt/intel/oneapi/setvars.sh --force  --config="/tmp/tmp/config.txt"
          du -ah ./dist
          cd dist
          for f in *.whl; do ${{matrix.python}} -m auditwheel show $f; done 
          for f in *.whl; do ${{matrix.python}} -m auditwheel repair -w ../wheelhouse $f; done    
          cd ../wheelhouse
          du -ah ./
      - uses: actions/upload-artifact@v4
        with:
          name: ${{matrix.artifact}}
          path: ./wheelhouse/*.whl
          retention-days: 30
          compression-level: 0

  build_wheels_linux_aarch64:
    name: Build wheels linux aarch64 ${{matrix.CIBW_BUILD}}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: wheel-linux_aarch64_python310
            os: ubuntu-latest
            arch: aarch64
            CIBW_BUILD: cp310-manylinux_aarch64
          - artifact: wheel-linux_aarch64_python311
            os: ubuntu-latest
            arch: aarch64
            CIBW_BUILD: cp311-manylinux_aarch64
          - artifact: wheel-linux_aarch64_python312
            os: ubuntu-latest
            arch: aarch64
            CIBW_BUILD: cp312-manylinux_aarch64
          - artifact: wheel-linux_aarch64_python313
            os: ubuntu-latest
            arch: aarch64
            CIBW_BUILD: cp313-manylinux_aarch64
          - artifact: wheel-linux_aarch64_python314
            os: ubuntu-latest
            arch: aarch64
            CIBW_BUILD: cp314-manylinux_aarch64
    steps:
      - uses: actions/checkout@v5
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
      - name: Build wheels on ${{matrix.arch}}
        uses: pypa/cibuildwheel@v3.2.1
        env:
          CIBW_BUILD: ${{matrix.CIBW_BUILD}}
          CIBW_ENVIRONMENT: ""
          CIBW_PLATFORM: linux
          CIBW_ARCHS: ${{matrix.arch}}
          CIBW_BEFORE_ALL_LINUX: >
            dnf config-manager --set-enabled powertools &&
            dnf makecache --refresh &&
            dnf -y --enablerepo=powertools install openblas-static &&
            dnf -y --enablerepo=powertools install lapack-static &&
            dnf -y install gcc-toolset-11 &&
            dnf -y --enablerepo=powertools install eigen3-devel
          CIBW_BEFORE_BUILD_LINUX: >
            source scl_source enable gcc-toolset-11 &&
            pip install --upgrade cmake ninja
      - uses: actions/upload-artifact@v4
        with:
          name: ${{matrix.artifact}}
          path: ./wheelhouse/*.whl
          retention-days: 30
          compression-level: 0

  build_wheels_macos:
    name: Build wheels macos ${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: wheel-macosx-x86_64
            arch: x86_64
            cibw_arch: x86_64
            llvm_openmp_url: https://conda.anaconda.org/conda-forge/osx-64/llvm-openmp-22.1.8-h0d3cbff_0.conda
            llvm_openmp_sha256: 7e8dcf03c2ef5491405d6d86eb892d14e99902f50f4eeb250db0cbdc58dd5818
          - artifact: wheel-macosx-arm64
            arch: arm64
            cibw_arch: arm64
            llvm_openmp_url: https://conda.anaconda.org/conda-forge/osx-arm64/llvm-openmp-22.1.8-hc7d1edf_0.conda
            llvm_openmp_sha256: ccbaad6bbc88f135ab849bc36af5fa6eda36a9ed18ce6f58e3dde3d11784c156
    steps:
      - uses: actions/checkout@v5
      - name: Install Dependency
        shell: bash
        run: |
          set -eux
          brew install eigen nlohmann-json
      - name: Download conda-forge llvm-openmp
        shell: bash
        run: |
          set -eux
          mkdir -p .vendor/llvm-openmp/archive .vendor/llvm-openmp/pkg .vendor/llvm-openmp/prefix
          curl -L "${{ matrix.llvm_openmp_url }}" -o .vendor/llvm-openmp/archive/llvm-openmp.conda
      - name: Verify llvm-openmp archive
        shell: bash
        run: |
          set -eux
          echo "${{ matrix.llvm_openmp_sha256 }}  .vendor/llvm-openmp/archive/llvm-openmp.conda" | shasum -a 256 -c -
      - name: Extract llvm-openmp
        shell: bash
        run: |
          set -euxo pipefail
          tar -xf .vendor/llvm-openmp/archive/llvm-openmp.conda -C .vendor/llvm-openmp/pkg
          zstd -dc .vendor/llvm-openmp/pkg/pkg-*.tar.zst | tar -xf - -C .vendor/llvm-openmp/prefix
          zstd -dc .vendor/llvm-openmp/pkg/info-*.tar.zst | tar -xf - -C .vendor/llvm-openmp/prefix
      - name: Check llvm-openmp supply
        shell: bash
        run: |
          set -eux
          test -f .vendor/llvm-openmp/prefix/include/omp.h
          test -f .vendor/llvm-openmp/prefix/lib/libomp.dylib
          test -f .vendor/llvm-openmp/prefix/info/licenses/openmp/LICENSE.TXT
          lipo -info .vendor/llvm-openmp/prefix/lib/libomp.dylib
          lipo .vendor/llvm-openmp/prefix/lib/libomp.dylib -verify_arch "${{ matrix.cibw_arch }}"
          otool -D .vendor/llvm-openmp/prefix/lib/libomp.dylib
      - name: Prepare llvm-openmp license notice
        shell: bash
        run: |
          set -eux
          mkdir -p llvm-openmp
          cp .vendor/llvm-openmp/prefix/info/licenses/openmp/LICENSE.TXT llvm-openmp/LICENSE.TXT
          echo "fdad1758a9e1f9d5a81e18879b3406772115edc92c24bfa36b70c654f325e8e4  llvm-openmp/LICENSE.TXT" | shasum -a 256 -c -
      - name: Build wheels on macos ${{ matrix.arch }}
        uses: pypa/cibuildwheel@v3.2.1
        env:
          CIBW_PLATFORM: macos
          CIBW_ARCHS_MACOS: ${{ matrix.cibw_arch }}
          CIBW_BUILD_FRONTEND: build
          CIBW_CONFIG_SETTINGS_MACOS: >
            wheel.license-files=LICENSE
            wheel.license-files=llvm-openmp/LICENSE.TXT
          CIBW_ENVIRONMENT_MACOS: >
            MACOSX_DEPLOYMENT_TARGET=12.0
            CMAKE_ARGS='-DCMAKE_PREFIX_PATH=${{ github.workspace }}/.vendor/llvm-openmp/prefix
            -DOpenMP_ROOT=${{ github.workspace }}/.vendor/llvm-openmp/prefix
            -DCMAKE_INSTALL_RPATH=${{ github.workspace }}/.vendor/llvm-openmp/prefix/lib
            -DOPENJIJ_REQUIRE_OPENMP=ON'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{matrix.artifact}}
          path: ./wheelhouse/*.whl
          retention-days: 30
          compression-level: 0

  build_wheels_windows:
    name: Build wheels windows ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: AMD64
            CIBW_PLATFORM: windows
            CIBW_ENVIRONMENT: "CMAKE_TOOLCHAIN_FILE='C:/vcpkg/scripts/buildsystems/vcpkg.cmake'"
    steps:
      - uses: actions/checkout@v5
      - name: Add msbuild to PATH
        if: ${{ matrix.os == 'windows-latest'}}
        uses: microsoft/setup-msbuild@v2.0.0
      - name: Install Dependency
        shell: powershell
        run: |
          vcpkg update
          vcpkg --triplet x64-windows-static install eigen3
          vcpkg --triplet x64-windows install eigen3
          vcpkg --triplet x64-windows-static install nlohmann-json
          vcpkg --triplet x64-windows install nlohmann-json
          vcpkg integrate install
      - name: Build wheels on ${{ matrix.CIBW_PLATFORM }} ${{matrix.arch}}
        uses: pypa/cibuildwheel@v3.2.1
        env:
          CIBW_ENVIRONMENT: ${{ matrix.CIBW_ENVIRONMENT }}
          CIBW_PLATFORM: ${{ matrix.CIBW_PLATFORM }}
          CIBW_ARCHS: ${{matrix.arch}}

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-windows
          path: ./wheelhouse/*.whl
          retention-days: 30
          compression-level: 0

  upload_pypi:
    needs:
      [
        build_wheels_linux_x86_64,
        build_wheels_linux_aarch64,
        build_wheels_macos,
        build_wheels_windows,
        build_sdist,
      ]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    if: ${{github.event_name == 'release'}}
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: ./dist
          pattern: wheel-*
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ./dist
          verify-metadata: true
          skip-existing: false
          verbose: true
